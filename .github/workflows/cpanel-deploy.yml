name: Build & Deploy to cPanel Shared Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (builds on GitHub, zero Node required on cPanel)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build cPanel /public + /app Bundle
        run: npm run build:cpanel

      - name: Package cpanel-deploy.zip artifact (contains /public and /app)
        run: |
          cd cpanel-dist
          zip -r ../cpanel-deploy.zip . -x "*.DS_Store"

      - name: Upload downloadable cpanel-deploy.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-deploy-zip
          path: cpanel-deploy.zip
          retention-days: 30

      - name: Check if optional FTPS secrets are configured
        id: ftp_check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTPS secrets not configured — skipping auto-deploy. Download cpanel-deploy-zip from Artifacts above."
          fi

      # Optional Auto-Deploy straight to cPanel (main domain OR subdomain folder)
      # Set FTP_SERVER_DIR to the parent folder containing /public and /app (e.g. /portfolio/ or /subdomains/dev/)
      - name: Auto-Deploy to cPanel via FTPS (when FTP secrets are set)
        if: steps.ftp_check.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./cpanel-dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/portfolio/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            app/config.php
            public/uploads/**
