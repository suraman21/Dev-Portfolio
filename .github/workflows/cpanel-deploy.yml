name: Build & Deploy to cPanel Shared Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (builds on GitHub, zero Node required on cPanel)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build cPanel /public + /app Bundle
        run: npm run build:cpanel

      - name: Package cpanel-deploy.zip artifact (contains /public and /app)
        run: |
          cd cpanel-dist
          zip -r ../cpanel-deploy.zip . -x "*.DS_Store"

      - name: Upload downloadable cpanel-deploy.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-deploy-zip
          path: cpanel-deploy.zip
          retention-days: 30

      # Publish ready-to-serve /public + /app to the `cpanel-deploy` branch so you can
      # run `git clone -b cpanel-deploy` and `git pull` directly in cPanel Terminal!
      - name: Publish built /public + /app to cpanel-deploy branch (for cPanel git clone / git pull)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cpanel-deploy-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE_URL" cpanel-deploy >/dev/null 2>&1; then
            git clone --branch cpanel-deploy --single-branch --depth 1 "$REMOTE_URL" /tmp/cpanel-deploy-repo
          else
            git init /tmp/cpanel-deploy-repo
            git -C /tmp/cpanel-deploy-repo checkout -b cpanel-deploy
            git -C /tmp/cpanel-deploy-repo remote add origin "$REMOTE_URL"
          fi

          # Sync freshly built /public + /app + .gitignore while keeping .git history intact
          find /tmp/cpanel-deploy-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a cpanel-dist/. /tmp/cpanel-deploy-repo/

          # Never track app/config.php in the deploy branch so `git pull` on cPanel never conflicts!
          # Users run `cp app/config.example.php app/config.php` once on cPanel.
          rm -f /tmp/cpanel-deploy-repo/app/config.php

          cd /tmp/cpanel-deploy-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish to cpanel-deploy."
          else
            git commit -m "Build /public + /app from ${GITHUB_SHA::7}"
            git push origin cpanel-deploy
          fi

      - name: Check if optional FTPS secrets are configured
        id: ftp_check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTPS secrets not configured — skipping FTPS auto-deploy. Use cPanel git pull (cpanel-deploy branch) or download cpanel-deploy-zip."
          fi

      # Optional Auto-Deploy straight to cPanel (main domain OR subdomain folder)
      # Set FTP_SERVER_DIR to the parent folder containing /public and /app (e.g. /portfolio/ or /subdomains/dev/)
      - name: Auto-Deploy to cPanel via FTPS (when FTP secrets are set)
        if: steps.ftp_check.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./cpanel-dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/portfolio/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            app/config.php
            public/uploads/**
